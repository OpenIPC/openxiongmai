name: build
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# External inputs are pinned so upstream changes cannot silently alter results.
# OpenIPC rebuilds the toolchain release assets in place: when a checksum
# check fails, verify the new tarball and update the sha256 here.
env:
  TOOLCHAIN_URL_XM530: https://github.com/OpenIPC/firmware/releases/download/toolchain/toolchain.xiongmai-xm530.tgz
  TOOLCHAIN_SHA256_XM530: c88003c5beb4eb9090a1cc03a02439888c25578bfa58924b21ef28a2762b94eb
  TOOLCHAIN_URL_XM510: https://github.com/OpenIPC/firmware/releases/download/toolchain/toolchain.xiongmai-xm510.tgz
  TOOLCHAIN_SHA256_XM510: 6850cf324c119782b7e5a0e883e7550fcfb9e61c2f51be955a7a04c22aa82013
  # OpenIPC/firmware commit providing kernel configs and kernel patches
  FIRMWARE_REF: 1eb14b97be010917da4ceac08f324f77e15810e8
  CROSS_COMPILE: arm-openipc-linux-musleabi-

jobs:
  #
  # libraries-cross-compile
  #
  # Builds every userspace library with the OpenIPC XM530 musl toolchain
  # (the same one firmware uses), checks that the outputs exist, asserts
  # the entry points the vendor ISP / application expects are exported,
  # and confirms the shared objects depend only on libc.
  #
  # sensor-tunings
  #
  # Runs libxmv200's sensor drivers on the build machine against every
  # tuning the vendor stack was recorded with (tools/xmv200-sns): each
  # driver has to make exactly the sensor writes its tuning holds.
  #
  sensor-tunings:
    name: libxmv200 sensor drivers against their tunings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make check, every chip family
        run: |
          for f in xm530v200 xm533 xm535 xm535w1; do
            echo "::group::$f"
            make -C tools/xmv200-sns check FAMILY=$f
            echo "::endgroup::"
          done

  #
  libraries-cross-compile:
    name: Libraries cross-compile (XM530)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenIPC XM530 toolchain
        run: |
          curl -sSLf -o "$RUNNER_TEMP/toolchain.tgz" "$TOOLCHAIN_URL_XM530"
          echo "$TOOLCHAIN_SHA256_XM530  $RUNNER_TEMP/toolchain.tgz" | sha256sum -c - \
            || { echo "::error::toolchain checksum changed upstream; update TOOLCHAIN_SHA256_XM530" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar xzf "$RUNNER_TEMP/toolchain.tgz" -C "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/arm-openipc-linux-musleabi_sdk-buildroot/bin" >> "$GITHUB_PATH"

      - name: Build libraries
        run: |
          ${CROSS_COMPILE}gcc --version | head -1
          # The libraries OpenIPC/firmware ships, built the way its
          # xiongmai-opensdk package does: through libraries/Makefile, with
          # the compiler and BR2_OPTIMIZE_S-style CFLAGS passed in.
          echo "::group::libraries (CHIPARCH=xm530)"
          make -C libraries CHIPARCH=xm530 \
            CC="${CROSS_COMPILE}gcc" AR="${CROSS_COMPILE}ar" STRIP="${CROSS_COMPILE}strip" \
            CFLAGS="-D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64 -Os -g0 -D_FORTIFY_SOURCE=1" \
            all
          echo "::endgroup::"
          # libmpi's Makefile hard-codes PATH; override it from the command line.
          echo "::group::libmpi"
          make -C libraries/libmpi CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"
          echo "::endgroup::"
          # tools/xmvenc-test builds libraries/libxmvenc first
          echo "::group::libxmvenc + tools/xmvenc-test"
          make -C tools/xmvenc-test CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xmvenc-test/xmvenc-test | grep -q 'Machine:.*ARM'
          if ${CROSS_COMPILE}readelf -d tools/xmvenc-test/xmvenc-test | grep -q NEEDED; then
            echo "xmvenc-test is not static" >&2; exit 1
          fi
          echo "::endgroup::"
          echo "::group::tools/xm-vi-hang"
          make -C tools/xm-vi-hang CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xm-vi-hang/xm-vi-hang | grep -q 'Machine:.*ARM'
          if ${CROSS_COMPILE}readelf -d tools/xm-vi-hang/xm-vi-hang | grep -q NEEDED; then
            echo "xm-vi-hang is not static" >&2; exit 1
          fi
          echo "::endgroup::"
          # tools/xmv200-test builds libraries/libxmv200 first
          echo "::group::libxmv200 + tools/xmv200-test"
          make -C tools/xmv200-test CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xmv200-test/xmv200-test | grep -q 'Machine:.*ARM'
          if ${CROSS_COMPILE}readelf -d tools/xmv200-test/xmv200-test | grep -q NEEDED; then
            echo "xmv200-test is not static" >&2; exit 1
          fi
          echo "::endgroup::"
          echo "::group::tools/xm-rgn-test"
          make -C tools/xm-rgn-test CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xm-rgn-test/xm-rgn-test | grep -q 'Machine:.*ARM'
          if ${CROSS_COMPILE}readelf -d tools/xm-rgn-test/xm-rgn-test | grep -q NEEDED; then
            echo "xm-rgn-test is not static" >&2; exit 1
          fi
          echo "::endgroup::"
          echo "::group::tools/xm-isp-trace"
          make -C tools/xm-isp-trace CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xm-isp-trace/isptrace.so | grep -q 'Type:.*DYN'
          ${CROSS_COMPILE}readelf -h tools/xm-isp-trace/isptrace.so | grep -q 'Machine:.*ARM'
          for s in open ioctl xmap munmap signal msgrcv; do
            ${CROSS_COMPILE}nm -D --defined-only tools/xm-isp-trace/isptrace.so | grep -qw "$s" ||
              { echo "isptrace.so does not export $s" >&2; exit 1; }
          done
          python3 -m py_compile tools/xm-isp-trace/decode.py
          echo "::endgroup::"
          # tools/xmispd builds libraries/libxmisp first
          echo "::group::libxmisp + tools/xmispd"
          make -C tools/xmispd CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xmispd/xmispd | grep -q 'Machine:.*ARM'
          if ${CROSS_COMPILE}readelf -d tools/xmispd/xmispd | grep -q NEEDED; then
            echo "xmispd is not static" >&2; exit 1
          fi
          python3 -m py_compile tools/xm-isp-trace/extract.py
          # the SoC-independent 3A layers, on the host
          make -C libraries/libxmisp test HOSTCC=gcc
          echo "::endgroup::"
          echo "::group::tools/xm-isp-tune"
          make -C tools/xm-isp-tune CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xm-isp-tune/ispreg | grep -q 'Machine:.*ARM'
          if ${CROSS_COMPILE}readelf -d tools/xm-isp-tune/ispreg | grep -q NEEDED; then
            echo "ispreg is not static" >&2; exit 1
          fi
          python3 -m py_compile tools/xm-isp-tune/colorchecker.py
          echo "::endgroup::"
          echo "::group::tools/xmhevc-test"
          make -C tools/xmhevc-test CROSS_COMPILE="$CROSS_COMPILE"
          ${CROSS_COMPILE}readelf -h tools/xmhevc-test/xmhevc-test | grep -q 'Machine:.*ARM'
          if ${CROSS_COMPILE}readelf -d tools/xmhevc-test/xmhevc-test | grep -q NEEDED; then
            echo "xmhevc-test is not static" >&2; exit 1
          fi
          echo "::endgroup::"

      - name: Verify outputs exist
        run: |
          for f in \
              libraries/libsns_X50_XM530/libsns_X50_XM530.so \
              libraries/libsns_X123_XM530/libsns_X123_XM530.so \
              libraries/libispapp_XM530/libispapp_XM530.so \
              libraries/libmpi/libopenmpi.a \
              libraries/libxmvenc/libxmvenc.a \
              libraries/libxmv200/libxmv200.a \
              libraries/libxmisp/libxmisp.a; do
            [ -f "$f" ] || { echo "MISSING: $f" >&2; exit 1; }
            echo "ok: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Assert exported symbols
        run: |
          fail=0
          check() {
            lib=$1; shift
            case "$lib" in
              *.so) syms=$(${CROSS_COMPILE}nm -D --defined-only "$lib") ;;
              *)    syms=$(${CROSS_COMPILE}nm --defined-only "$lib") ;;
            esac
            for s in "$@"; do
              if echo "$syms" | grep -qE " [TDR] $s\$"; then
                echo "ok: $lib exports $s"
              else
                echo "MISSING: $lib does not export $s" >&2; fail=1
              fi
            done
          }
          for lib in libraries/libsns_X50_XM530/libsns_X50_XM530.so \
                     libraries/libsns_X123_XM530/libsns_X123_XM530.so; do
            check "$lib" sensor_register_callback sensor_unregister_callback \
                         sensor_init sensor_mode_set
          done
          check libraries/libsns_X123_XM530/libsns_X123_XM530.so \
                sensor_getlist_sc2239 cmos_init_sensor_exp_function_sc2239 \
                cmos_init_ae_exp_function_sc2239 cmos_init_awb_exp_function_sc2239
          check libraries/libispapp_XM530/libispapp_XM530.so \
                XM_I2C_Ioctl SysGetProductInfo
          check libraries/libmpi/libopenmpi.a \
                XM_MPI_SYS_Init XM_MPI_SYS_MmzAlloc XM_MPI_VI_INIT \
                XM_MPI_VENC_CreateChn XM_MPI_RGN_INIT
          check libraries/libxmvenc/libxmvenc.a \
                xmvenc_open xmvenc_close xmvenc_chip xmvenc_max_width \
                xmvenc_mmz_alloc xmvenc_chn_create xmvenc_chn_destroy \
                xmvenc_chn_request_idr xmvenc_encode \
                xmvenc_pipe_create xmvenc_pipe_destroy xmvenc_pipe_start \
                xmvenc_pipe_stop xmvenc_pipe_chn xmvenc_pipe_get \
                xmvenc_pipe_release xmvenc_pipe_stats
          check libraries/libxmv200/libxmv200.a \
                xmv200_board_start xmv200_board_layout xmv200_layout_start \
                xmv200_layout_parse xmv200_layout_format \
                xmv200_frame_get xmv200_frame_release \
                xmv200_venc_create xmv200_venc_encode xmv200_venc_destroy \
                xmv200_venc_request_idr xmv200_ae_frame xmv200_i2c_read \
                xmv200_i2c_write xmv200_mmz_alloc \
                xmv200_image_set xmv200_image_get xmv200_image_defaults \
                xmv200_mask_set xmv200_mask_clear \
                xmv200_md_set xmv200_md_get \
                xmv200_venc_create_h264 xmv200_venc_set_cabac \
                xmv200_ae_state xmv200_awb_state \
                xmv200_bd_set xmv200_bd_get
          check libraries/libxmisp/libxmisp.a \
                xmisp_open xmisp_start xmisp_script xmisp_fd xmisp_stop \
                xmisp_close xmisp_error xmisp_scripts xmisp_h62_720p \
                xmisp_frame xmisp_exposure xmisp_ae_enabled xmisp_sensor_h62 \
                xmisp_ae_init xmisp_ae_update xmisp_ae_applied xmisp_ae_flicker \
                xmisp_set_antiflicker xmisp_nr_strength xmisp_strength xmisp_lerp \
                xmisp_awb_enabled xmisp_white_balance \
                xmisp_awb_init xmisp_awb_update xmisp_awb_applied \
                xmisp_awb_candidates xmisp_expand xmisp_xm510_start \
                xmisp_h42_720p xmisp_h65_720p xmisp_sc1235_720p \
                xmisp_sc2145h_720p xmisp_sc2235_1080p xmisp_ar0130_720p \
                xmisp_ov9750_720p xmisp_ov9732_720p xmisp_mis1002_720p \
                xmisp_sc1135_720p xmisp_sc1135_960p xmisp_sc1235_960p \
                xmisp_h65_960p xmisp_start_mode xmisp_sensor_ar0130 \
                xmisp_sensor_h42 xmisp_sensor_h65_720p xmisp_sensor_h65_960p \
                xmisp_sensor_sc1135_720p xmisp_sensor_sc1135_960p \
                xmisp_sensor_sc1235_720p xmisp_sensor_sc1235_960p \
                xmisp_sensor_sc2145h xmisp_sensor_sc2235 xmisp_sensor_ov9750 \
                xmisp_sensor_ov9732 xmisp_soi_gain xmisp_soi_gain_reg \
                xmisp_soi_get xmisp_soi_set xmisp_ss_gain xmisp_ss_gain_regs \
                xmisp_ss_get xmisp_ss_set xmisp_set_daynight xmisp_night \
                xmisp_dn_init xmisp_dn_update
          exit $fail

      - name: Assert no vendor libs in NEEDED
        run: |
          fail=0
          for lib in libraries/*/*.so; do
            needed=$(${CROSS_COMPILE}readelf -d "$lib" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
            echo "$lib: ${needed:-<none>}"
            for n in $needed; do
              case "$n" in
                libc.so*) ;;
                *) echo "UNEXPECTED NEEDED in $lib: $n" >&2; fail=1 ;;
              esac
            done
          done
          exit $fail

  #
  # kernel-modules
  #
  # Builds the out-of-tree kernel modules for each Xiongmai kernel the
  # OpenIPC firmware ships, the same way firmware does: the pinned
  # openipc/linux branch, the firmware's <soc>.generic.config, and the
  # firmware's generic kernel patches (gcc 8/12/13 compiler headers, etc.).
  #
  kernel-modules:
    name: Kernel modules (${{ matrix.soc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - soc: xm510
            kernel_ref: 373be8a95fd3303d10bc27c3101564eb8bb63930  # xiongmai-xm510
            kernel_version: 3.0.101
          - soc: xm530
            kernel_ref: 533ce629d351f752acbd1d928f00a2ee5a71a2ca  # xiongmai-xm530
            kernel_version: 3.10.103
    steps:
      - uses: actions/checkout@v4

      - name: Fetch firmware kernel config and patches
        uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware
          sparse-checkout: |
            general/package/all-patches/linux
            br-ext-chip-xiongmai/board/${{ matrix.soc }}

      - name: Install OpenIPC ${{ matrix.soc }} toolchain
        run: |
          case "${{ matrix.soc }}" in
            xm510) url=$TOOLCHAIN_URL_XM510; sum=$TOOLCHAIN_SHA256_XM510 ;;
            xm530) url=$TOOLCHAIN_URL_XM530; sum=$TOOLCHAIN_SHA256_XM530 ;;
          esac
          curl -sSLf -o "$RUNNER_TEMP/toolchain.tgz" "$url"
          echo "$sum  $RUNNER_TEMP/toolchain.tgz" | sha256sum -c - \
            || { echo "::error::toolchain checksum changed upstream; update the ${{ matrix.soc }} sha256" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/toolchain"
          tar xzf "$RUNNER_TEMP/toolchain.tgz" -C "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/arm-openipc-linux-musleabi_sdk-buildroot/bin" >> "$GITHUB_PATH"

      - name: Prepare ${{ matrix.soc }} kernel tree
        run: |
          KDIR="$RUNNER_TEMP/linux"
          mkdir -p "$KDIR"
          curl -sSLf "https://github.com/OpenIPC/linux/archive/${{ matrix.kernel_ref }}.tar.gz" \
            | tar xz --strip-components=1 -C "$KDIR"
          for p in firmware/general/package/all-patches/linux/*.patch; do
            echo "applying $(basename "$p")"
            patch -d "$KDIR" -p1 --forward < "$p"
          done
          cp "firmware/br-ext-chip-xiongmai/board/${{ matrix.soc }}/${{ matrix.soc }}.generic.config" "$KDIR/.config"
          # 3.0 has no olddefconfig; accept defaults for new symbols. `yes` dies
          # of SIGPIPE when make exits, which pipefail would treat as failure.
          (yes "" || true) | make -C "$KDIR" ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" oldconfig > /dev/null
          make -C "$KDIR" ARCH=arm CROSS_COMPILE="$CROSS_COMPILE" -j"$(nproc)" modules_prepare
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"

      - name: Build xm_i2c
        run: |
          make -C drivers/xm_i2c KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build hx280enc
        run: |
          make -C drivers/hx280enc KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The VI driver reimplements xm530_vi.ko; XM510 has a different VI block.
      - name: Build xm_vi
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_vi KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The XM510 VI driver reimplements xm510_vi.ko, a different block from
      # the XM530's.
      - name: Build xm510_vi
        if: matrix.soc == 'xm510'
        run: |
          make -C drivers/xm510_vi KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The XM530/XM550 ISP device reimplements xm530_isp.ko.
      - name: Build xm530_isp
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm530_isp KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The XM510 ISP device reimplements xm510_isp.ko.
      - name: Build xm510_isp
        if: matrix.soc == 'xm510'
        run: |
          make -C drivers/xm510_isp KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The region (OSD) driver reimplements xm530_rgn.ko.
      - name: Build xm530_rgn
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm530_rgn KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The XM510 region (OSD) driver reimplements xm510_rgn.ko, a different
      # block from the XM530's.
      - name: Build xm510_rgn
        if: matrix.soc == 'xm510'
        run: |
          make -C drivers/xm510_rgn KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The MMZ driver reimplements mmz.ko: the XM530/XM550 one, and the
      # XM510's older one on CONFIG_ARCH_XM510.
      - name: Build xm_mmz
        run: |
          make -C drivers/xm_mmz KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_hevc
        run: |
          make -C drivers/xm_hevc KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_i2c
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_i2c KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_sys
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_sys KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_vb
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_vb KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_venc
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_venc KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_rgn
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_rgn KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm533_vi
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm533_vi KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm535_vpss
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm535_vpss KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm535w1_vi
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm535w1_vi KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm530v200_vpss
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm530v200_vpss KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_adc
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_adc KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_ddr
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_ddr KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_log
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_log KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_acodec
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_acodec KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_i2s
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_i2s KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm533_mipi_io
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm533_mipi_io KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build hx280enc for the V200 series (H264_CHIP=v200)
        if: matrix.soc == 'xm530'
        run: |
          cp -r drivers/hx280enc "$RUNNER_TEMP/hx280enc-v200"
          make -C "$RUNNER_TEMP/hx280enc-v200" KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH" H264_CHIP=v200

      - name: Build xm530v200_jpeg
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm530v200_jpeg KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm533_venc_mem
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm533_venc_mem KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_nn
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_nn KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm533_ive
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm533_ive KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm530v200_vo
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm530v200_vo KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm533_isp
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm533_isp KDIR="$KDIR" ARCH=arm \
