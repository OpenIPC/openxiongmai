      - name: Build xm535w1_isp
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm535w1_isp KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      # The V200 series' USB host (3.10 only; the XM510 kernel has no USB)
      - name: Build dwc2
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/dwc2 KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Build xm_v200_usb0
        if: matrix.soc == 'xm530'
        run: |
          make -C drivers/xm_v200_usb0 KDIR="$KDIR" ARCH=arm \
            CROSS_COMPILE="$CROSS_COMPILE" PATH="$PATH"

      - name: Verify modules
        run: |
          modules="drivers/xm_i2c/xm_i2c.ko drivers/hx280enc/open_h264.ko drivers/xm_mmz/open_mmz.ko drivers/xm_hevc/open_hevc.ko"
          # the XM530/XM550 and the V200 series' modules: the 3.10 kernel only
          [ "${{ matrix.soc }}" = xm530 ] && modules="$modules drivers/xm_vi/open_vi.ko drivers/xm530_isp/open_isp.ko drivers/xm530_rgn/open_rgn.ko drivers/xm_v200_i2c/open_i2c.ko drivers/xm_v200_sys/open_sys.ko drivers/xm_v200_vb/open_vb.ko drivers/xm_v200_venc/open_venc.ko drivers/xm_v200_rgn/open_rgn.ko drivers/xm533_vi/open_vi.ko drivers/xm535_vpss/open_vpss.ko drivers/xm535w1_vi/open_vi.ko drivers/xm530v200_vpss/open_vpss.ko drivers/xm_v200_adc/open_adc.ko drivers/xm_v200_ddr/open_ddr.ko drivers/xm_v200_log/open_log.ko drivers/xm_v200_acodec/open_acodec.ko drivers/xm_v200_i2s/open_i2s.ko drivers/xm533_mipi_io/open_mipi_io.ko $RUNNER_TEMP/hx280enc-v200/open_h264.ko drivers/xm530v200_jpeg/open_jpeg.ko drivers/xm533_venc_mem/open_venc_mem.ko drivers/xm_v200_nn/open_nn.ko drivers/xm533_ive/open_ive.ko drivers/xm530v200_vo/open_vo.ko drivers/xm533_isp/open_isp.ko drivers/xm530v200_isp/open_isp.ko drivers/xm535_isp/open_isp.ko drivers/xm535w1_isp/open_isp.ko drivers/dwc2/open_dwc2.ko drivers/xm_v200_usb0/open_xm_usb0.ko drivers/xm_v200_rtc/open_rtc.ko drivers/xm_v200_vdec/open_vdec.ko drivers/xm_v200_var/open_var.ko drivers/xm_v200_dma/open_dma.ko drivers/xm_v200_motor/open_motor.ko"
          [ "${{ matrix.soc }}" = xm510 ] && modules="$modules drivers/xm510_vi/open_vi.ko drivers/xm510_isp/open_isp.ko drivers/xm510_rgn/open_rgn.ko"
          for ko in $modules; do
            [ -f "$ko" ] || { echo "MISSING: $ko" >&2; exit 1; }
            ${CROSS_COMPILE}readelf -h "$ko" | grep -q 'Machine:.*ARM' \
              || { echo "$ko is not an ARM object" >&2; exit 1; }
            vermagic=$(${CROSS_COMPILE}strings "$ko" | grep '^vermagic=')
            echo "ok: $ko ($vermagic)"
            case "$vermagic" in
              "vermagic=${{ matrix.kernel_version }}"[+\ ]*) ;;
              *) echo "unexpected vermagic for $ko, want ${{ matrix.kernel_version }}" >&2; exit 1 ;;
            esac
          done
          # the open VI drivers export the frame API kernel callers use
          vi=drivers/xm_vi/open_vi.ko
          [ "${{ matrix.soc }}" = xm510 ] && vi=drivers/xm510_vi/open_vi.ko
          for sym in vi_get_frame vi_release_frame; do
            ${CROSS_COMPILE}nm "$vi" | grep -q " __ksymtab_$sym\$" \
              || { echo "$vi does not export $sym" >&2; exit 1; }
          done
